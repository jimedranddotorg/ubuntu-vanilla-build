name: Build Ubuntu / Pop!_OS Image

on:
  workflow_dispatch:
    inputs:
      distro:
        description: "Target distribution"
        type: choice
        options:
          - ubuntu
          - popos
        default: ubuntu
      output:
        description: "Output image artifact type"
        type: choice
        options:
          - iso
          - img
          - vm
          - removable
        default: iso
      release:
        description: "Target suite (Pop!_OS supports noble & resolute only)"
        type: choice
        options:
          - noble
          - resolute
          - devel
        default: noble
      arch:
        description: "Target CPU architecture (native runner per arch)"
        type: choice
        options:
          - amd64
          - arm64
        default: amd64
      profile:
        description: "System profile"
        type: choice
        options:
          - desktop
          - cli
        default: desktop
      desktop:
        description: "Desktop environment (desktop profile only; cosmic is Pop!_OS only)"
        type: choice
        options:
          - gnome
          - cosmic
          - xfce
          - kde-plasma
          - mate
          - cinnamon
          - budgie
          - lxde
          - lxqt
        default: gnome
      desktop_variant:
        description: "Desktop tier / extras (GNOME recommends, KDE tier, or MATE options)"
        type: choice
        options:
          - default
          - gnome-recommends
          - kde-standard
          - kde-plasma-desktop
          - kde-full
          - mate-full
          - mate-core
          - mate-full-extras
          - mate-core-extras
        default: default
      kernel:
        description: "Kernel flavor (system76 is Pop!_OS amd64 only)"
        type: choice
        options:
          - generic
          - lowlatency
          - system76
        default: generic
      brave_channel:
        description: "Brave browser channel (desktop profile)"
        type: choice
        options:
          - release
          - origin
          - none
        default: release
      firefox_variant:
        description: "Firefox variant (firefox-popos is Pop!_OS only)"
        type: choice
        options:
          - none
          - firefox
          - firefox-esr
          - firefox-popos
        default: none
      librewolf:
        description: "Pre-install LibreWolf (desktop profile)"
        type: boolean
        default: false
      thunderbird:
        description: "Pre-install Thunderbird (desktop profile)"
        type: boolean
        default: false
      pacstall:
        description: "Install Pacstall via Chaotic PPR"
        type: boolean
        default: true
      openssh_server:
        description: "OpenSSH server (auto enables on cloud img)"
        type: choice
        options:
          - auto
          - enable
          - disable
        default: auto
      cockpit:
        description: "Pre-install Cockpit web admin console"
        type: boolean
        default: false
      security:
        description: "Security MAC framework (Ubuntu only: apparmor or selinux)"
        type: choice
        options:
          - apparmor
          - selinux
        default: apparmor
      firmware:
        description: "Disk image firmware (auto = hybrid for amd64 removable, else uefi)"
        type: choice
        options:
          - auto
          - uefi
          - hybrid
        default: auto
      disk_size_gb:
        description: "Disk image size in GB (blank = 32 GB cloud/vm, 16 GB removable)"
        type: string
        default: ""
      vm_formats:
        description: "VM export formats (when output = vm)"
        type: choice
        options:
          - qcow2
          - all
          - vdi
          - vmdk
          - vhdx
          - none
        default: qcow2
      network_stack:
        description: "CLI profile network stack (auto = networkd for cli)"
        type: choice
        options:
          - auto
          - networkd
          - network-manager
        default: auto
      locale:
        description: "System locale (e.g. en_US.UTF-8)"
        type: string
        default: en_US.UTF-8
      keyboard_layout:
        description: "Keyboard layout code (e.g. us, de)"
        type: string
        default: us
      config_file:
        description: "Optional repo .cfg path for Advanced Mode custom ISOs (e.g. scripts/build.cfg)"
        type: string
        default: ""
      config_mode:
        description: "Precedence when config_file is set"
        type: choice
        options:
          - inputs-override-config
          - config-wins
          - inputs-only
        default: inputs-override-config
      advanced_overrides:
        description: "Advanced Mode KEY=VALUE overrides (; or newline-separated, e.g. TARGET_FWUPD=1; TARGET_NAME=custom)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.distro }}-${{ inputs.output }}-${{ inputs.release }}-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ inputs.distro }}-${{ inputs.output }} (${{ inputs.release }}/${{ inputs.arch }})
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      IN_DISTRO: ${{ inputs.distro }}
      IN_OUTPUT: ${{ inputs.output }}
      IN_RELEASE: ${{ inputs.release }}
      IN_ARCH: ${{ inputs.arch }}
      IN_PROFILE: ${{ inputs.profile }}
      IN_DESKTOP: ${{ inputs.desktop }}
      IN_DESKTOP_VARIANT: ${{ inputs.desktop_variant }}
      IN_KERNEL: ${{ inputs.kernel }}
      IN_BRAVE_CHANNEL: ${{ inputs.brave_channel }}
      IN_FIREFOX_VARIANT: ${{ inputs.firefox_variant }}
      IN_LIBREWOLF: ${{ inputs.librewolf }}
      IN_THUNDERBIRD: ${{ inputs.thunderbird }}
      IN_PACSTALL: ${{ inputs.pacstall }}
      IN_OPENSSH_SERVER: ${{ inputs.openssh_server }}
      IN_COCKPIT: ${{ inputs.cockpit }}
      IN_SECURITY: ${{ inputs.security }}
      IN_FIRMWARE: ${{ inputs.firmware }}
      IN_DISK_SIZE_GB: ${{ inputs.disk_size_gb }}
      IN_VM_FORMATS: ${{ inputs.vm_formats }}
      IN_NETWORK_STACK: ${{ inputs.network_stack }}
      IN_LOCALE: ${{ inputs.locale }}
      IN_KEYBOARD_LAYOUT: ${{ inputs.keyboard_layout }}
      IN_CONFIG_FILE: ${{ inputs.config_file }}
      IN_CONFIG_MODE: ${{ inputs.config_mode }}
      IN_ADVANCED_OVERRIDES: ${{ inputs.advanced_overrides }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare runner disk space and directories
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          ws_base="${RUNNER_TEMP}/uvb-ws"
          out_base="${RUNNER_TEMP}/uvb-out"
          if [[ -d /mnt && -w /mnt ]]; then
            mnt_avail="$(df -Pm /mnt | awk 'NR==2 {print $4}')"
            tmp_avail="$(df -Pm "${RUNNER_TEMP}" | awk 'NR==2 {print $4}')"
            if [[ "$mnt_avail" =~ ^[0-9]+$ && "$tmp_avail" =~ ^[0-9]+$ ]] && (( mnt_avail > tmp_avail )); then
              ws_base="/mnt/uvb-ws"
              out_base="/mnt/uvb-out"
            fi
          fi
          mkdir -p "$ws_base" "$out_base"
          echo "UVB_WS_BASE=${ws_base}" >> "$GITHUB_ENV"
          echo "UVB_OUT_BASE=${out_base}" >> "$GITHUB_ENV"
          df -h "$ws_base"

      - name: Resolve Advanced Mode config and validate inputs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path

          repo_root = Path.cwd().resolve()
          common_txt = (repo_root / "scripts/lib/common.sh").read_text(encoding="utf-8")
          m_allow = re.search(r'case "\$key" in\s*(.*?)\n\s*;;', common_txt, re.S)
          allow = set(re.findall(r'[A-Z_][A-Z0-9_]*', m_allow.group(1)))

          def parse_kv_lines(text, source_label):
              parsed = {}
              for raw_line in text.splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  # strip inline comment starting with whitespace + '#'
                  line = re.sub(r'\s+#.*$', '', line).strip()
                  m = re.match(r'^([A-Z_][A-Z0-9_]*)=(.*)$', line)
                  if not m:
                      print(f"::error::Invalid config syntax in {source_label}: {raw_line}", file=sys.stderr)
                      sys.exit(1)
                  key, val = m.group(1), m.group(2).strip()
                  if (val.startswith('"') and val.endswith('"')) or (val.startswith("'") and val.endswith("'")):
                      if len(val) >= 2:
                          val = val[1:-1].strip()
                  if key not in allow:
                      print(f"::error::Unsupported config key '{key}' in {source_label}.", file=sys.stderr)
                      sys.exit(1)
                  if val:
                      parsed[key] = val
              return parsed

          distro = os.environ["IN_DISTRO"]
          output = os.environ["IN_OUTPUT"]
          config_file = os.environ["IN_CONFIG_FILE"].strip()
          config_mode = os.environ["IN_CONFIG_MODE"]
          overrides_raw = os.environ["IN_ADVANCED_OVERRIDES"].strip()

          cfg_kv = {}
          if config_mode != "inputs-only" and config_file:
              cfg_path = (repo_root / config_file).resolve()
              try:
                  cfg_path.relative_to(repo_root)
              except ValueError:
                  print(f"::error::config_file must stay inside the repository: {config_file}", file=sys.stderr)
                  sys.exit(1)
              if not cfg_path.is_file():
                  print(f"::error::config_file not found: {config_file}", file=sys.stderr)
                  sys.exit(1)
              cfg_kv = parse_kv_lines(cfg_path.read_text(encoding="utf-8"), config_file)
          elif config_mode == "config-wins" and not config_file:
              print("::error::config_mode='config-wins' requires config_file to be specified.", file=sys.stderr)
              sys.exit(1)

          # Parse semicolon- or newline-separated KEY=VALUE overrides.
          override_lines = "\n".join(part.strip() for chunk in overrides_raw.splitlines() for part in chunk.split(";") if part.strip())
          override_kv = parse_kv_lines(override_lines, "advanced_overrides") if override_lines else {}

          # Build workflow input map.
          input_kv = {
              "TARGET_UBUNTU_VERSION": os.environ["IN_RELEASE"],
              "TARGET_ARCH": os.environ["IN_ARCH"],
              "TARGET_IMAGE_PROFILE": os.environ["IN_PROFILE"],
              "TARGET_KERNEL_FLAVOR": os.environ["IN_KERNEL"],
              "TARGET_PACSTALL": "1" if os.environ["IN_PACSTALL"] == "true" else "0",
              "TARGET_COCKPIT": "1" if os.environ["IN_COCKPIT"] == "true" else "0",
          }
          if distro == "ubuntu":
              input_kv["TARGET_SECURITY"] = os.environ["IN_SECURITY"]
          elif os.environ["IN_SECURITY"] != "apparmor":
              print("::error::security='selinux' is only supported for Ubuntu builds.", file=sys.stderr)
              sys.exit(1)

          if os.environ["IN_PROFILE"] == "desktop":
              desktop = os.environ["IN_DESKTOP"]
              variant = os.environ["IN_DESKTOP_VARIANT"]
              input_kv["TARGET_DESKTOP"] = desktop
              input_kv["TARGET_BRAVE_CHANNEL"] = os.environ["IN_BRAVE_CHANNEL"]
              input_kv["TARGET_LIBREWOLF"] = "1" if os.environ["IN_LIBREWOLF"] == "true" else "0"
              input_kv["TARGET_THUNDERBIRD"] = "1" if os.environ["IN_THUNDERBIRD"] == "true" else "0"
              ff = os.environ["IN_FIREFOX_VARIANT"]
              input_kv["TARGET_FIREFOX"] = "1" if ff == "firefox" else "0"
              input_kv["TARGET_FIREFOX_ESR"] = "1" if ff == "firefox-esr" else "0"
              input_kv["TARGET_FIREFOX_POPOS"] = "1" if ff == "firefox-popos" else "0"
              if variant == "gnome-recommends":
                  if desktop != "gnome" and config_mode != "config-wins":
                      print("::error::desktop_variant='gnome-recommends' requires desktop='gnome'.", file=sys.stderr)
                      sys.exit(1)
                  input_kv["TARGET_GNOME_INSTALL_RECOMMENDS"] = "1"
              elif variant.startswith("kde-"):
                  if desktop != "kde-plasma" and config_mode != "config-wins":
                      print(f"::error::desktop_variant='{variant}' requires desktop='kde-plasma'.", file=sys.stderr)
                      sys.exit(1)
                  input_kv["TARGET_KDE_PACKAGE"] = variant
              elif variant.startswith("mate-"):
                  if desktop != "mate" and config_mode != "config-wins":
                      print(f"::error::desktop_variant='{variant}' requires desktop='mate'.", file=sys.stderr)
                      sys.exit(1)
                  input_kv["TARGET_MATE_PACKAGE"] = "mate-desktop-environment-core" if "core" in variant else "mate-desktop-environment"
                  input_kv["TARGET_MATE_EXTRAS"] = "1" if "extras" in variant else "0"
          else:
              input_kv["TARGET_DESKTOP"] = "cli"
              if os.environ["IN_NETWORK_STACK"] != "auto":
                  input_kv["TARGET_NETWORK_STACK"] = os.environ["IN_NETWORK_STACK"]

          openssh = os.environ["IN_OPENSSH_SERVER"]
          if openssh == "enable":
              input_kv["TARGET_OPENSSH_SERVER"] = "1"
          elif openssh == "disable":
              input_kv["TARGET_OPENSSH_SERVER"] = "0"

          if output != "iso":
              if os.environ["IN_FIRMWARE"] != "auto":
                  input_kv["TARGET_FIRMWARE"] = os.environ["IN_FIRMWARE"]
              disk_sz = os.environ["IN_DISK_SIZE_GB"].strip()
              if disk_sz:
                  if not disk_sz.isdigit():
                      print(f"::error::disk_size_gb must be an integer (got: '{disk_sz}').", file=sys.stderr)
                      sys.exit(1)
                  input_kv["TARGET_DISK_SIZE_GB"] = disk_sz
              if output == "vm":
                  input_kv["TARGET_VM_FORMATS"] = os.environ["IN_VM_FORMATS"]

          locale = os.environ["IN_LOCALE"].strip()
          if locale:
              if not re.match(r'^[A-Za-z0-9_.@-]+$', locale):
                  print(f"::error::Invalid locale format: '{locale}'.", file=sys.stderr)
                  sys.exit(1)
              input_kv["TARGET_LOCALE"] = locale

          kb = os.environ["IN_KEYBOARD_LAYOUT"].strip()
          if kb:
              if not re.match(r'^[a-zA-Z0-9_-]+$', kb):
                  print(f"::error::Invalid keyboard layout code: '{kb}'.", file=sys.stderr)
                  sys.exit(1)
              input_kv["TARGET_KEYBOARD_LAYOUT"] = kb

          # Merge according to config_mode.
          if config_mode == "inputs-only":
              merged = {**input_kv, **override_kv}
          elif config_mode == "config-wins":
              merged = dict(cfg_kv)
              ff_keys = {"TARGET_FIREFOX", "TARGET_FIREFOX_ESR", "TARGET_FIREFOX_POPOS"}
              cfg_has_ff = any(k in cfg_kv for k in ff_keys)
              for k, v in input_kv.items():
                  if k in merged:
                      continue
                  if k in ff_keys and cfg_has_ff:
                      continue
                  if k == "TARGET_DESKTOP" and cfg_kv.get("TARGET_IMAGE_PROFILE") == "cli":
                      continue
                  merged[k] = v
              merged.update(override_kv)
          else:  # inputs-override-config
              merged = {**cfg_kv, **input_kv, **override_kv}

          # Always enforce CI runtime paths & non-interactive Advanced Mode flags.
          merged["ADVANCED_MODE"] = "1"
          merged["INTERACTIVE"] = "0"
          merged["NO_CONFIRM"] = "1"
          merged["UVB_UI_MODE"] = "cli"
          merged["UBUNTU_VANILLA_WORKSPACE"] = os.environ["UVB_WS_BASE"]
          merged["UVB_OUTPUT_DIR"] = os.environ["UVB_OUT_BASE"]

          # Validate resolved combination.
          rel = merged.get("TARGET_UBUNTU_VERSION", "")
          arch = merged.get("TARGET_ARCH", "amd64")
          prof = merged.get("TARGET_IMAGE_PROFILE", "desktop")
          kern = merged.get("TARGET_KERNEL_FLAVOR", "generic")
          desk = merged.get("TARGET_DESKTOP", "cli" if prof == "cli" else "gnome")
          fw = merged.get("TARGET_FIRMWARE", "uefi")
          vm_fmt = merged.get("TARGET_VM_FORMATS", "qcow2")

          if distro == "popos" and rel == "devel":
              print("::error::Pop!_OS does not support the 'devel' suite. Choose 'noble' or 'resolute'.", file=sys.stderr)
              sys.exit(1)
          if desk == "cosmic" and distro != "popos":
              print("::error::Desktop 'cosmic' is only available for Pop!_OS builds.", file=sys.stderr)
              sys.exit(1)
          if kern == "system76" and distro != "popos":
              print("::error::Kernel 'system76' is only available for Pop!_OS builds.", file=sys.stderr)
              sys.exit(1)
          if kern == "system76" and arch == "arm64":
              print("::error::linux-system76 is only published for amd64; choose 'generic' or 'lowlatency' on arm64.", file=sys.stderr)
              sys.exit(1)
          if merged.get("TARGET_FIREFOX_POPOS") == "1" and distro != "popos":
              print("::error::'firefox-popos' is only available for Pop!_OS builds.", file=sys.stderr)
              sys.exit(1)
          if merged.get("TARGET_SECURITY", "apparmor") == "selinux" and distro != "ubuntu":
              print("::error::TARGET_SECURITY='selinux' is only supported for Ubuntu builds.", file=sys.stderr)
              sys.exit(1)
          if arch == "arm64" and output != "iso" and fw == "hybrid":
              print("::error::ARM64 disk images only support UEFI firmware (set firmware to 'auto' or 'uefi').", file=sys.stderr)
              sys.exit(1)

          runner_arch = os.environ["IN_ARCH"]
          need_qemu = "1" if arch != runner_arch else "0"

          cfg_out = Path(os.environ["RUNNER_TEMP"]) / "uvb-ci.cfg"
          lines = ["# Generated by GitHub Actions (Advanced Mode)"]
          for k in sorted(merged):
              lines.append(f"{k}={merged[k]}")
          cfg_out.write_text("\n".join(lines) + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envf:
              envf.write(f"UVB_CI_CFG={cfg_out}\n")
              envf.write(f"NEED_QEMU_USER={need_qemu}\n")
              envf.write(f"RESOLVED_RELEASE={rel}\n")
              envf.write(f"RESOLVED_ARCH={arch}\n")
              envf.write(f"RESOLVED_PROFILE={prof}\n")
              envf.write(f"RESOLVED_DESKTOP={desk}\n")
              envf.write(f"RESOLVED_KERNEL={kern}\n")
              envf.write(f"RESOLVED_VM_FORMATS={vm_fmt}\n")
          PY

      - name: Install host build dependencies
        run: |
          set -euo pipefail
          pkgs=(debootstrap zstd)
          case "$IN_OUTPUT" in
            iso)           pkgs+=(squashfs-tools xorriso) ;;
            img|removable) pkgs+=(parted dosfstools e2fsprogs rsync) ;;
            vm)            pkgs+=(parted dosfstools e2fsprogs rsync qemu-utils) ;;
          esac
          sudo apt-get update
          if [[ "${NEED_QEMU_USER:-0}" == "1" ]]; then
            if apt-cache show qemu-user-static >/dev/null 2>&1; then
              pkgs+=(qemu-user-static)
            else
              pkgs+=(qemu-user qemu-user-binfmt)
            fi
          fi
          sudo apt-get install -y "${pkgs[@]}"

      - name: Build image (Advanced Mode)
        run: |
          set -euo pipefail
          case "${IN_DISTRO}-${IN_OUTPUT}" in
            ubuntu-iso)       builder="./scripts/build.sh" ;;
            ubuntu-img)       builder="./scripts/build-img.sh" ;;
            ubuntu-vm)        builder="./scripts/build-vm.sh" ;;
            ubuntu-removable) builder="./scripts/build-removable.sh" ;;
            popos-iso)        builder="./scripts/build-popos.sh" ;;
            popos-img)        builder="./scripts/build-popos-img.sh" ;;
            popos-vm)         builder="./scripts/build-popos-vm.sh" ;;
            popos-removable)  builder="./scripts/build-popos-removable.sh" ;;
            *) echo "::error::Unsupported target ${IN_DISTRO}-${IN_OUTPUT}"; exit 1 ;;
          esac

          "$builder" \
            --advanced \
            --config="${UVB_CI_CFG}" \
            --no-interactive \
            --no-color \
            --no-screen \
            -

      - name: Verify checksums and prepare artifacts
        run: |
          set -euo pipefail
          cd "$UVB_OUT_BASE"
          shopt -s nullglob

          for sum_file in *.sha256; do
            sha256sum -c "$sum_file"
          done

          # Compress raw .img artifacts with zstd so GitHub Actions artifact upload stays compact.
          for img in *.img; do
            if [[ "$IN_OUTPUT" == "vm" && "${RESOLVED_VM_FORMATS:-qcow2}" != "none" ]]; then
              rm -f -- "$img" "${img}.sha1" "${img}.sha256"
            else
              zstd -T0 --rm -q "$img"
              rm -f -- "${img}.sha1" "${img}.sha256"
              sha256sum "${img}.zst" > "${img}.zst.sha256"
            fi
          done

          {
            echo "## Build Summary"
            echo ""
            echo "- **Target**: \`${IN_DISTRO} / ${IN_OUTPUT}\`"
            echo "- **Release / Arch**: \`${RESOLVED_RELEASE} / ${RESOLVED_ARCH}\`"
            echo "- **Profile / Kernel**: \`${RESOLVED_PROFILE} (${RESOLVED_DESKTOP}) / ${RESOLVED_KERNEL}\`"
            echo "- **Config Mode**: \`${IN_CONFIG_MODE}\`${IN_CONFIG_FILE:+ (\`${IN_CONFIG_FILE}\`)}"
            echo ""
            echo "### Resolved Advanced Mode Configuration"
            echo '```ini'
            sed 's/^TARGET_USER_PASSWORD=.*/TARGET_USER_PASSWORD=***/' "$UVB_CI_CFG"
            echo '```'
            echo ""
            echo "### Artifacts"
            ls -lh
            echo ""
            echo "### SHA-256 Checksums"
            echo '```text'
            cat *.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.distro }}-${{ inputs.output }}-${{ env.RESOLVED_RELEASE }}-${{ env.RESOLVED_ARCH }}-${{ env.RESOLVED_PROFILE }}
          path: ${{ env.UVB_OUT_BASE }}/*
          if-no-files-found: error
          retention-days: 14
