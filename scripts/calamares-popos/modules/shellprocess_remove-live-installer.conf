# SPDX-License-Identifier: MIT
# Remove live-only CLI installer, Calamares config, and live SSH credentials from target.
---
dontChroot: false
timeout: 30
script:
  - "rm -f /usr/local/bin/install-system /etc/profile.d/99-uvb-live-cli.sh /etc/casper.conf /etc/ssh/sshd_config.d/01-uvb-live-ssh.conf /usr/local/sbin/uvb-live-ssh-setup /etc/systemd/system/uvb-live-ssh-user.service /etc/systemd/system/multi-user.target.wants/uvb-live-ssh-user.service /usr/local/sbin/uvb-live-cosmic-autologin /etc/systemd/system/uvb-live-cosmic-autologin.service /etc/systemd/system/multi-user.target.wants/uvb-live-cosmic-autologin.service /usr/share/applications/install-system.desktop /etc/skel/Desktop/install-system.desktop"
  - "rm -rf /etc/calamares"
